name: Bootstrap Gradle wrapper JAR

on:
  push:
    branches:
      - codex/-sportzal
    paths:
      - .github/workflows/bootstrap-gradle-wrapper.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codex branch
        uses: actions/checkout@v4
        with:
          ref: codex/-sportzal
          persist-credentials: true

      - name: Download and verify Gradle 8.14.4 wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          curl --fail --location --retry 3 \
            --output gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.14.4/gradle/wrapper/gradle-wrapper.jar
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Commit wrapper JAR to Codex branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1 && git diff --quiet -- gradle/wrapper/gradle-wrapper.jar; then
            echo "Wrapper JAR already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar
          git commit -m "build: add Gradle wrapper jar"
          git push origin HEAD:codex/-sportzal

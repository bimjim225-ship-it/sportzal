name: Выпустить тестовый APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Validate documentation
        run: python tools/validate_docs.py
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Prepare APK and release metadata
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/debug/app-debug.apk'
          if [[ ! -f "$source_apk" ]]; then
            echo "Expected APK was not created: $source_apk" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          build_timestamp="$(date -u +'%Y%m%d-%H%M')"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          apk_name="Sportzal-test-${short_sha}.apk"
          mkdir -p dist
          cp "$source_apk" "dist/$apk_name"

          {
            echo "SHORT_SHA=$short_sha"
            echo "RELEASE_TAG=test-${build_timestamp}-${short_sha}"
            echo "RELEASE_NAME=Sportzal Test ${short_sha}"
            echo "APK_NAME=$apk_name"
            echo 'RELEASE_NOTES<<EOF'
            echo "Git commit SHA: ${GITHUB_SHA}"
            echo "Build date: ${build_date}"
            echo "Branch: ${BRANCH_NAME}"
            echo
            echo 'TEST BUILD. Uses temporary debug signing. Future test APKs may require uninstalling the previous build before installation.'
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sportzal-test-apk
          path: dist/Sportzal-test-*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_NOTES" \
            --prerelease
